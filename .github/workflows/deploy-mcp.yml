name: Build and Deploy MCP

on:
  workflow_dispatch:
  push:
    branches:
      - "development"

env:
  IMAGE_NAME: ${{ vars.VPS_IP }}:32000/ebc-mcp:development
  KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build Docker image
        run: docker build . -f ./McpDockerfile -t ${{ env.IMAGE_NAME }}

      - name: Prepare to Push Docker image
        run: sudo bash .github/scripts/prepare-insecure-registry.sh

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}


  deploy:

    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 
        uses: actions/checkout@v3

      - name: Replace Variables
        uses: Lambdaspire/action-substitute-secrets-in-file@v1.1.0
        with:
          file: .github/deployments/deployment-mcp.yaml
          tokenPattern: '#{TOKEN}#'
          secretsJson: ${{ toJSON(secrets) }}

      - name: Apply Deployment
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONTEXT: ${{ env.KUBE_CONTEXT }}
          KUBE_CONFIG: ${{ env.KUBE_CONFIG }}
        with:
          args: apply -f .github/deployments/deployment-mcp.yaml

      - name: Apply Ingress
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONTEXT: ${{ env.KUBE_CONTEXT }}
          KUBE_CONFIG: ${{ env.KUBE_CONFIG }}
        with:
          args: apply -f .github/deployments/ingress.yaml

      - name: Make It Real!
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONTEXT: ${{ env.KUBE_CONTEXT }}
          KUBE_CONFIG: ${{ env.KUBE_CONFIG }}
        with:
          args: rollout restart deploy ecletica-beer-control-mcp -n ebl
      