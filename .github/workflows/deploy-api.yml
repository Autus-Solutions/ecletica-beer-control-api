name: Deploy API

on:
  workflow_dispatch:
  push:
    branches:
      - development

jobs:
  deploy:
    uses: Autus-Solutions/autus-infra/.github/workflows/reusable-k8s-build-deploy.yml@main
    with:
      app_name: ecletica-beer-control-api
      namespace: ebl
      dockerfile: ./ApiDockerfile
      context: .
      container_port: "8080"
      health_path: /health
      ingress_hosts: api.ecletica.beer
      tls_secret_name: ebl-api-tls
      environment_name: production
      image_pull_secret_name: ghcr-pull-secret
      ingress_annotations: |
        cert-manager.io/issuer: ebl-issuer
        cert-manager.io/issuer-kind: OriginIssuer
        cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
        external-dns.alpha.kubernetes.io/hostname: ecletica.beer
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
