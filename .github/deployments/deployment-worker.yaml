
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecletica-beer-control-worker
  namespace: ebl
  labels:
    app: ecletica-beer-control-worker
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 0 # Default to 10 if not specified
  selector:
    matchLabels:
      app: ecletica-beer-control-worker
  template:
    metadata:
      labels:
        app: ecletica-beer-control-worker
    spec:
      containers:
      - name: ecletica-beer-control-worker
        image: localhost:32000/ebc-worker:development
        ports:
          - containerPort: 80
        resources:
          requests:
            cpu: 250m
            memory: "300Mi"
          limits:
            cpu: 500m
            memory: "450Mi"
        imagePullPolicy: Always
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: #{ENVIRONMENT}#
          - name: ConnectionStrings__Database
            value: #{CONNECTIONSTRINGS__DATABASE}#
          - name: ConnectionStrings__Timeseries
            value: #{CONNECTIONSTRINGS__TIMESERIES}#
          - name: ConnectionStrings__Amqp
            value: #{CONNECTIONSTRINGS__AMQP}#
          - name: BetterStack__SourceToken
            value: #{BETTERSTACK__SOURCETOKEN}#
          - name: MessageBroker__Host
            value: #{MESSAGEBROKER__HOST}#
          - name: MessageBroker__VHost
            value: #{MESSAGEBROKER__VHOST}#
          - name: MessageBroker__Port
            value: "#{MESSAGEBROKER__PORT}#"
          - name: MessageBroker__Username
            value: #{MESSAGEBROKER__USERNAME}#
          - name: MessageBroker__Password
            value: #{MESSAGEBROKER__PASSWORD}#
          - name: MqttBroker__Host
            value: #{MQTTBROKER__HOST}#
          - name: MqttBroker__Port
            value: "#{MQTTBROKER__PORT}#"
          - name: MqttBroker__Username
            value: #{MQTTBROKER__USERNAME}#
          - name: MqttBroker__Password
            value: #{MQTTBROKER__PASSWORD}#

---
apiVersion: v1
kind: Service
metadata:
  name: ebc-worker-service
  namespace: ebl
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  sessionAffinity: None
  selector:
    app: ecletica-beer-control-worker
status:
  loadBalancer: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecletica-beer-control-worker
  namespace: ebl
spec:
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecletica-beer-control-worker