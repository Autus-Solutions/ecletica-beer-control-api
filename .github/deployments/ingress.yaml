apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: in-ebc-api
  namespace: ebl
  labels:
    app: in-ebc-api
  annotations:
    kubernetes.io/ingress.class: public
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    # ssl certificate
    cert-manager.io/issuer: ebl-issuer
    cert-manager.io/issuer-kind: OriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
    # dns record
    external-dns.alpha.kubernetes.io/hostname: ecletica.beer
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  rules:
  - host: "api.ecletica.beer"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: ebc-api-service
            port:
              number: 80
  tls:
    # specifying a host in the TLS section will tell cert-manager what
    # DNS SANs should be on the created certificate.
    - hosts:
        - "api.ecletica.beer"
        - "mcp.ecletica.beer"
     # cert-manager will create this secret
      secretName: ebl-api-tls